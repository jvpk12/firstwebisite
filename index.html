<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Form</title>
</head>
<body>

    <form action="#" method="POST">
        <div>
            <label for="name">What is your name?</label><br>
            <input type="text" id="name" name="name" required>
        </div>
        <br>

        <div>
            <label>Will you attend?</label><br>
            <input type="radio" id="attend_yes" name="attendance" value="yes" required>
            <label for="attend_yes">Yes</label><br>
            <input type="radio" id="attend_no" name="attendance" value="no" required>
            <label for="attend_no">No</label>
        </div>
        <br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
